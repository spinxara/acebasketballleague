<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ACE Basketball League Guidebook & Stats{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="public-body">
  <header class="site-header">
    <div class="brand-row">
      <img
        class="logo-mark"
        src="{{ url_for('static', filename='logo.png') }}"
        alt="LA ACE Basketball"
      />
      <div class="brand-copy">
        <h1>ACE Basketball League Guidebook & Stats</h1>
        <p class="meta-line">Stats Last Updated: {{ last_updated }}</p>
      </div>
    </div>
    <nav class="public-nav" aria-label="Public guidebook">
      {% for item in public_nav %}
        <a
          class="nav-link{% if active == item.id %} active{% endif %}"
          href="{{ url_for(item.endpoint) }}"
        >{{ item.label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>ACE Basketball League &middot; {{ current_year }}</span>
    <div class="footer-links">
      <a href="{{ url_for('league_rules') }}">Game Rules</a>
      <a href="{{ url_for('admin_dashboard') }}">Admin</a>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
