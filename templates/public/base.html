<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ACE Basketball League Guidebook & Stats{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="public-body">
  <header class="site-header">
    <div class="brand-row">
      <div class="logo-mark" aria-hidden="true">
        <div>
          <span class="la">LA</span>
          <span class="ace">ACE</span>
          <span class="sub">BASKETBALL</span>
        </div>
      </div>
      <div class="brand-copy">
        <h1>ACE Basketball League Guidebook & Stats</h1>
        <p class="meta-line">Stats Last Updated: {{ last_updated }}</p>
      </div>
    </div>
    <nav class="public-nav" aria-label="Public guidebook">
      {% for item in public_nav %}
        <a
          class="nav-link{% if active == item.id %} active{% endif %}"
          href="{{ url_for(item.endpoint) }}"
        >{{ item.label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>ACE Basketball League &middot; {{ current_year }}</span>
    <a href="{{ url_for('admin_dashboard') }}">Admin</a>
  </footer>
</body>
</html>
