<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin · ACE League Stats{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-brand-row">
      <div class="admin-logo">ACE</div>
      <div class="admin-brand-copy">
        <h1>ACE League Admin</h1>
        <p>Captain and admin tools for roster, games, and tournament entry.</p>
      </div>
    </div>
    <nav class="admin-nav" aria-label="Admin">
      {% for item in admin_nav %}
        <a
          class="nav-link{% if active == item.id %} active{% endif %}"
          href="{{ url_for(item.endpoint) }}"
        >{{ item.label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer admin-footer">
    <span>Admin area · captains only</span>
    <a href="{{ url_for('home') }}">Back to public site</a>
  </footer>
</body>
</html>
